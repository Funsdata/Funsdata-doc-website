name: Build and Deploy to Aliyun OSS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_DOCS_CDN_BASE_URL: https://funsdata-doc.oss-cn-beijing.aliyuncs.com
          VITE_DOCS_REPO_OWNER: Funsdata
          VITE_DOCS_REPO_NAME: FunsdataBI-doc
          VITE_DOCS_REPO_BRANCH: master
          VITE_DOCS_USE_JSDELIVR: 'false'

      - name: Setup aliyun-cli
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: 'latest'

      - name: Configure aliyun-cli
        run: |
          aliyun configure set \
            --profile default \
            --mode AK \
            --region cn-beijing \
            --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Deploy to OSS
        run: |
          # 先删除旧文件
          aliyun oss rm oss://funsdata-doc-webiste/ --recursive --force || true

          # 上传 HTML 文件
          aliyun oss cp dist/ oss://funsdata-doc-webiste/ --recursive \
            --include "*.html" \
            --meta "Content-Type:text/html; charset=utf-8"

          # 上传 JS 文件
          aliyun oss cp dist/ oss://funsdata-doc-webiste/ --recursive \
            --include "*.js" \
            --meta "Content-Type:application/javascript; charset=utf-8"

          # 上传 CSS 文件
          aliyun oss cp dist/ oss://funsdata-doc-webiste/ --recursive \
            --include "*.css" \
            --meta "Content-Type:text/css; charset=utf-8"

          # 上传 JSON 文件
          aliyun oss cp dist/ oss://funsdata-doc-webiste/ --recursive \
            --include "*.json" \
            --meta "Content-Type:application/json; charset=utf-8"

          # 上传 SVG 文件
          aliyun oss cp dist/ oss://funsdata-doc-webiste/ --recursive \
            --include "*.svg" \
            --meta "Content-Type:image/svg+xml"

          # 上传图片文件
          aliyun oss cp dist/ oss://funsdata-doc-webiste/ --recursive \
            --include "*.png" --include "*.jpg" --include "*.jpeg" \
            --include "*.gif" --include "*.webp" --include "*.ico"

          # 上传字体文件
          aliyun oss cp dist/ oss://funsdata-doc-webiste/ --recursive \
            --include "*.woff" --include "*.woff2" --include "*.ttf" --include "*.eot"

          echo "✅ Site deployed successfully!"